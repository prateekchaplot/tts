[project]
name = "tts"
version = "0.1.0"
description = "Local TTS CLI using Hugging Face models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "soundfile>=0.14.0",
    "torch>=2.0",
    "transformers>=4.40,<5",
]

[project.optional-dependencies]
kokoro = ["kokoro"]
piper = ["piper-tts"]
coqui = ["TTS"]
bark = ["bark"]

[tool.uv]
package = false