[project]
name = "tts"
version = "0.1.0"
description = "Local TTS CLI using Hugging Face models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=4.0",
    "kokoro>=0.9.4",
    "numpy>=2.5.4",
    "soundfile>=0.14.0",
    "torch>=2.0",
    "transformers>=4.40,<5",
]

[project.optional-dependencies]
piper = ["piper-tts"]
coqui = ["TTS"]
bark = ["bark"]
mcp = ["gradio[mcp]"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "."]
extend-exclude = [".venv", "output", "__pycache__", ".opencode"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/tts/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
