name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/tts tests

      - name: Ruff format check
        run: ruff format --check src/tts tests

      - name: Mypy
        run: mypy src/tts

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier
        working-directory: frontend
        run: npm run format:check

      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Pytest unit suite
        run: pytest tests/unit

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Vitest
        working-directory: frontend
        run: npm test

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      # Voice file cache is keyed by voice id; the download is a no-op on a hit.
      - name: Restore default Piper voice
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tts-data/voices
          key: piper-voice-en_US-lessac-medium-v1

      - name: Download default voice (one-time, requires internet)
        env:
          TTS_DATA_DIR: ${{ runner.temp }}/tts-data
        run: >-
          python -m piper.download_voices en_US-lessac-medium
          --download-dir "$RUNNER_TEMP/tts-data/voices"

      - name: Check for integration tests
        id: integration-tests
        run: |
          if [ -n "$(find tests/integration -name 'test_*.py' -print -quit 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No integration tests yet (arrive with T1.6); skipping pytest."
          fi

      - name: Pytest integration suite
        if: steps.integration-tests.outputs.present == 'true'
        env:
          TTS_DATA_DIR: ${{ runner.temp }}/tts-data
        run: pytest tests/integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore default Piper voice
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tts-data/voices
          key: piper-voice-en_US-lessac-medium-v1

      - name: Download default voice (one-time, requires internet)
        env:
          TTS_DATA_DIR: ${{ runner.temp }}/tts-data
        run: >-
          python -m piper.download_voices en_US-lessac-medium
          --download-dir "$RUNNER_TEMP/tts-data/voices"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Check for e2e suite
        id: e2e-suite
        run: |
          if [ -f tests/e2e/playwright.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Playwright config yet (arrives with T5.1); skipping browser install and specs."
          fi

      - name: Install Playwright browsers
        if: steps.e2e-suite.outputs.present == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start tts server
        if: steps.e2e-suite.outputs.present == 'true'
        env:
          TTS_DATA_DIR: ${{ runner.temp }}/tts-data
          TTS_PORT: "8321"
        run: |
          tts > "$RUNNER_TEMP/tts-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8321/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/tts-server.log"
          exit 1

      - name: Run Playwright suite
        if: steps.e2e-suite.outputs.present == 'true'
        working-directory: frontend
        run: npx playwright test --config ../tests/e2e/playwright.config.ts

      - name: Server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/tts-server.log" || true
