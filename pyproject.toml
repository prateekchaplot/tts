[project]
name = "tts"
version = "0.1.0"
description = "Local TTS CLI using Hugging Face models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "soundfile>=0.14.0",
    "torch>=2.0",
    "transformers>=4.40,<5",
]

[project.optional-dependencies]
kokoro = ["kokoro"]
piper = ["piper-tts"]
coqui = ["TTS"]
bark = ["bark"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]